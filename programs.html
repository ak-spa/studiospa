<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="СПА-программы салона СтудиоСпа: ритуалы талассо, авторские и детокс-программы, программы для деловых мужчин и для беременных. Все цены на сайте.">
  <title>СПА-программы — СПА-салон СтудиоСпа в «Балтийской жемчужине»</title>
  <link rel="icon" href="img/favicon-draft-1.png?d=1">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Roboto+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=35">
</head>
<body data-page="programs.html">
  <header class="site-header"></header>

  <main>
    <section class="services-hero" style="background:color-mix(in srgb, var(--cocoa) 4%, white);padding:40px 0 24px">
      <div class="container">
        <p class="breadcrumbs"><a href="index.html">Главная</a> → <a href="services.html">Услуги и цены</a> → СПА-программы</p>
        <h1 class="section-title" style="margin-top:12px">СПА-<span class="accent font-accent">программы</span></h1>
        <p class="section-sub">Ритуалы талассо, авторские и детокс-программы, программы для мужчин и будущих мам</p>
        <div id="cat-tabs" class="reveal" style="margin-top:16px"></div>
        <p style="text-align:center;color:var(--text-secondary);font-weight:500;margin-top:22px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:15px;height:15px;vertical-align:-2.5px;margin-right:6px"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10.2v4.3"/><path d="M12 16.9v.01"/></svg>
          Имеются противопоказания. Необходимо проконсультироваться со специалистом.</p>
      </div>
    </section>

    <!-- Программы: парные (для двоих) живут на отдельной странице
         spa-for-two.html, поэтому здесь их не показываем -->
    <section style="padding-top:28px">
      <div class="container" id="catalog"></div>
    </section>
  </main>

  <footer class="site-footer"></footer>
  <script src="data/site.js"></script>
  <script src="data/services.js"></script>
  <script src="js/app.js?v=5"></script>
  <script>
    window.initPage = async function () {
      const data = await loadServices();
      document.getElementById('cat-tabs').innerHTML = renderCatTabsHtml('programs.html');

      const cat = data.categories.find(c => c.key === 'programs');
      const all = data.services
        .filter(s => s.category === 'programs' && !/двоих/i.test(s.subtitle || ''))
        .sort((a, b) => (a.order || 999) - (b.order || 999));

      document.getElementById('catalog').innerHTML =
        catHeadHtml(cat)
        + renderCatalogGroups(groupServices(all, [
            { title: 'СПА–ритуалы талассо', test: s => /талассо/i.test(s.subtitle || '') },
            { title: 'Наши программы', test: s => (s.subtitle || '') === 'Наши программы' },
            { title: 'Детокс-программы', test: s => /детокс/i.test(s.subtitle || '') },
            { title: 'Для деловых мужчин', test: s => /мужчин/i.test(s.subtitle || '') },
            { title: 'Для беременных', test: s => /беременн/i.test(s.subtitle || '') },
          ]), { hideSubtitle: true });
      initReveal();
    };
  </script>
</body>
</html>
